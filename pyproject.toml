[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastguard"
version = "0.2.0"
description = "Sub-millisecond, streaming-native PII guardrail & reversible vault for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lokesh Jothiram", email = "lokesh.jothiram.contact@gmail.com" }
]
dependencies = [
    "phonenumbers>=8.13.0"
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.5.0"
]
demo = [
    "gradio>=4.0"
]
dev = [
    "pytest>=7.0",
    "build",
    "twine"
]
